apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: enterprise

spec:
  replicas: 1

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:
        - name: payment-service

          image: venkatesh2007567/payment-service:1.0.7
          imagePullPolicy: Always

          ports:
            - containerPort: 8084
              protocol: TCP

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: enterprise

spec:
  type: ClusterIP

  selector:
    app: payment-service

  ports:
    - port: 8084
      targetPort: 8084
      protocol: TCP

