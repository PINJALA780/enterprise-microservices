spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://postgres:5432/enterprise
    username: enterprise
    password: enterprise123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always
